[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmwareloop"
version = "0.0.10"
description = "AI Agent Firmware Development and Lab Automation Platform (Dual-Tier MCP Server)"
readme = "README.md"
authors = [
    { name = "WeilinZhang", email = "19523330249@163.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.7.0",
    "pyserial>=3.5",
    "pytest>=8.0.0",
    "pyocd>=0.36.0",
    "pyyaml>=6.0",
    "agentic-hil>=0.14.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Jeffrey1799/FirmwareLoop"
Repository = "https://github.com/Jeffrey1799/FirmwareLoop.git"

[project.scripts]
firmwareloop = "tools.fw_mcp_server:main"
fwloop = "tools.fw_mcp_server:main"
fw-mcp = "tools.fw_mcp_server:main"
fw = "tools.fw_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
"*" = ["*.ps1", "*.psm1", "*.yaml", "*.md", "*.json"]
